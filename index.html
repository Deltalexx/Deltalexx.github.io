<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Tiamo - Estrellas y Corazones</title>
  <style>
    html,body{height:100%;margin:0}
    /* asegurar espacio para notch en iPhones modernos */
    body{background:#000;overflow:hidden;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
    canvas{display:block;width:100%;height:100%}
    /* contador de tiempo debajo del cono */
    #timeCounter{
      position:absolute;
      left:50%;
      transform:translateX(-50%);
      pointer-events:none;
      z-index:20;
      text-align:center;
      color:#fff;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,'Helvetica Neue',Arial;
      text-shadow:0 1px 2px rgba(0,0,0,0.6);
      user-select:none;
      top:calc(50% + 160px); /* valor por defecto; se ajusta dinámicamente */
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:6px;
    }
    #timePhrase{font-size:14px;opacity:0.95;line-height:1}
    #timeValues{font-weight:700;font-size:16px;letter-spacing:0.4px;line-height:1.1;display:block;text-align:center}
  </style>
</head>
<body>
  <canvas id="scene"></canvas>

  <!-- Contador de tiempo: frase + valores -->
  <div id="timeCounter" aria-live="polite">
    <div id="timePhrase">El tiempo a tu lado vuela</div>
    <div id="timeValues">-- años · -- meses · -- días · -- horas · -- segundos</div>
  </div>

  <script>
    const canvas = document.getElementById('scene');
    const ctx = canvas.getContext('2d');

    function resize(){
      const dpr = window.devicePixelRatio || 1;
      canvas.width = Math.floor(window.innerWidth * dpr);
      canvas.height = Math.floor(window.innerHeight * dpr);
      canvas.style.width = window.innerWidth + 'px';
      canvas.style.height = window.innerHeight + 'px';
      // usar setTransform para mapear coordenadas CSS -> device pixels
      // algunos Safari tienen comportamiento distinto con clearRect cuando
      // se usa setTransform; por eso mantenemos dibujo en coordenadas CSS
      // Establecer transform y además normalizar el espacio de dibujo.
      // En Safari algunos métodos requieren limpiar en coordenadas CSS,
      // por eso usamos setTransform pero luego clearRect/fillRect con window.innerWidth/innerHeight.
      ctx.setTransform(dpr,0,0,dpr,0,0);
      // recalcular tamaño del cono y otros elementos que dependen del tamaño
      // hacer el cono más grande en general, especialmente en móvil
      if(window.innerWidth < 420) coneW = Math.min(460, window.innerWidth * 0.86);
      else coneW = Math.min(520, window.innerWidth * 0.6);
      // Modo rendimiento: activar en dispositivos pequeños o con pocas CPU
      try{
        const cores = navigator.hardwareConcurrency || 4;
        performanceMode = (window.innerWidth < 900) || (cores < 4);
      }catch(e){ performanceMode = window.innerWidth < 900; }
    }

    // Parámetros
    let N = 80; // número de figuras (se ajusta según pantalla)
    let coneW = Math.min(280, window.innerWidth*0.36);
    const color = '#FFD700'; // amarillo dorado para el contorno
    let performanceMode = false; // si true, reducir efectos y contidad para más fluidez

    // Utilidades
    function rand(min, max){ return Math.random() * (max - min) + min }

    // Path de corazón centrado en 0,0 y escalable
    function createHeartPath(size){
      const p = new Path2D();
      const s = size;
      p.moveTo(0, -s/4);
      p.bezierCurveTo(s/2, -s*3/4, s*1.2, -s/8, 0, s);
      p.bezierCurveTo(-s*1.2, -s/8, -s/2, -s*3/4, 0, -s/4);
      return p;
    }

    // Path de estrella de 5 puntas centrada en 0,0
    function createStarPath(size){
      const p = new Path2D();
      const spikes = 5;
      const outer = size;
      const inner = size * 0.5;
      let rot = Math.PI / 2 * 3;
      let x = 0;
      let y = 0;
      let step = Math.PI / spikes;
      p.moveTo(0, -outer);
      for(let i=0;i<spikes;i++){
        x = Math.cos(rot) * outer;
        y = Math.sin(rot) * outer;
        p.lineTo(x,y);
        rot += step;

        x = Math.cos(rot) * inner;
        y = Math.sin(rot) * inner;
        p.lineTo(x,y);
        rot += step;
      }
      p.closePath();
      return p;
    }

    // Partícula
    class Particle{
      constructor(type){
        this.type = type; // 'heart'|'star'
        this.reset(true);
      }
      reset(init=false){
        this.size = rand(8, 44);
        // posición distribuida por toda la pantalla
        this.x = rand(-50, window.innerWidth + 50);
        this.y = rand(-50, window.innerHeight + 50);
        // velocidad aleatoria en ambas direcciones
        const speed = rand(10, 120) / 60; // px/frame aprox
        const angle = rand(0, Math.PI*2);
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        this.rot = rand(0, Math.PI*2);
        this.vrot = rand(-0.03,0.03);
        this.lineWidth = Math.max(1, Math.round(this.size/14));
        this.path = (this.type === 'heart') ? createHeartPath(this.size) : createStarPath(this.size);
        if(!init && Math.random() < 0.02) this.initFade = 1; else this.initFade = 0;
      }
      update(dt){
        this.x += this.vx * dt;
        this.y += this.vy * dt;
        this.rot += this.vrot * dt;
        // reaparición cuando sale de pantalla (envolver)
        const margin = 80;
        if(this.x < -margin) this.x = window.innerWidth + margin;
        if(this.x > window.innerWidth + margin) this.x = -margin;
        if(this.y < -margin) this.y = window.innerHeight + margin;
        if(this.y > window.innerHeight + margin) this.y = -margin;
      }
      draw(ctx){
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rot);
        ctx.lineWidth = this.lineWidth;
        ctx.strokeStyle = color;
        ctx.fillStyle = 'transparent';
        // dibujar solo el contorno
        ctx.stroke(this.path);
        ctx.restore();
      }

    }

    // Mensaje como partícula (texto solo contorno, se comporta como estrella/corazón)
    class MessageParticle{
      constructor(text){
        this.text = text;
        this.reset();
      }
      reset(){
        const cx = window.innerWidth/2;
        this.x = cx + rand(-80,80);
        this.y = Math.max(40, window.innerHeight/2 - coneW*0.9) + rand(-30,30);
        const speed = rand(4, 18) / 60;
        const angle = rand(-Math.PI/3, Math.PI/3);
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        this.fontSize = Math.max(12, Math.round(coneW * 0.10));
        this.rot = rand(-0.08, 0.08);
        this.vrot = rand(-0.004, 0.004);
      }
      update(dt){
        this.x += this.vx * dt;
        this.y += this.vy * dt;
        this.rot += this.vrot * dt;
        // envolver en pantalla similar a partículas
        const margin = 60;
        if(this.x < -margin) this.x = window.innerWidth + margin;
        if(this.x > window.innerWidth + margin) this.x = -margin;
        if(this.y < -margin) this.y = window.innerHeight + margin;
        if(this.y > window.innerHeight + margin) this.y = -margin;
      }
      draw(ctx){
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rot);
        ctx.lineWidth = Math.max(1, Math.round(this.fontSize * 0.09));
        ctx.strokeStyle = '#FFD700';
        ctx.fillStyle = 'transparent';
        ctx.font = `bold ${this.fontSize}px sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        // dibujar solo contorno del texto para parecer parte del fondo
        ctx.strokeText(this.text, 0, 0);
        ctx.restore();
      }
    }

    // Crear partículas
    const particles = [];
    function createParticles(){
      particles.length = 0;
      // ajustar densidad para móviles
      const w = window.innerWidth;
      // reducir para mejorar rendimiento y evitar congelamiento
      if(performanceMode){
        if(w < 420) N = 10;
        else if(w < 900) N = 16;
        else N = 24;
      }else{
        if(w < 420) N = 18;
        else if(w < 900) N = 28;
        else N = 40;
      }
      for(let i=0;i<N;i++){
        const type = Math.random() < 0.5 ? 'heart' : 'star';
        particles.push(new Particle(type));
      }
      // añadir mensaje como partícula del fondo
      particles.push(new MessageParticle('Feliz 21 de septiembre'));
    }

    // ===== Flash de cámara (estrellas / destellos aleatorios en el fondo) =====
    class Flash{
      constructor(){ this.reset(); }
      reset(){
        this.active = false;
        this.x = 0; this.y = 0; this.size = 0;
        this.life = 0; this.age = 0; this.maxAlpha = 0;
      }
      spawn(x,y,size,life,maxAlpha){
        this.active = true; this.x = x; this.y = y; this.size = size;
        this.life = life; this.age = 0; this.maxAlpha = maxAlpha;
      }
      update(dt){
        if(!this.active) return;
        this.age += dt * (1000/60);
        if(this.age >= this.life) { this.active = false; }
      }
      draw(ctx){
        if(!this.active) return;
        const a = 1 - (this.age / this.life);
        const alpha = a * this.maxAlpha;
        const r = this.size;
        // radial glow
        const g = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, r*1.8);
        g.addColorStop(0, `rgba(255,255,255,${alpha})`);
        g.addColorStop(0.2, `rgba(255,245,200,${alpha*0.6})`);
        g.addColorStop(0.6, `rgba(255,200,120,${alpha*0.18})`);
        g.addColorStop(1, `rgba(0,0,0,0)`);
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(this.x, this.y, r*1.8, 0, Math.PI*2); ctx.fill();
        // small star cross lines
        ctx.strokeStyle = `rgba(255,255,255,${alpha*0.9})`;
        ctx.lineWidth = Math.max(1, r*0.12);
        ctx.beginPath();
        ctx.moveTo(this.x - r, this.y);
        ctx.lineTo(this.x + r, this.y);
        ctx.moveTo(this.x, this.y - r);
        ctx.lineTo(this.x, this.y + r);
        ctx.stroke();
        ctx.restore();
      }
    }

    const flashPool = [];
    function createFlashPool(){
      flashPool.length = 0;
      const max = 12;
      for(let i=0;i<max;i++) flashPool.push(new Flash());
    }
    function spawnFlash(){
      // elegir un slot libre
      for(const f of flashPool){
        if(!f.active){
          const margin = 20;
          const x = rand(margin, window.innerWidth - margin);
          const y = rand(margin, window.innerHeight - margin - 80);
          const base = (window.innerWidth < 420) ? rand(6,18) : rand(8,28);
          const life = rand(300, 700); // ms
          const alpha = rand(0.35, 0.9);
          f.spawn(x,y,base,life,alpha);
          break;
        }
      }
    }


    // Flores pequeñas eliminadas por petición: ya no se generan ni se dibujan.

    // ===== Ramo central =====
    class Flower{
      constructor(type, x, y, size){
        this.type = type; // 'lily'|'daisy'|'poppy'
        this.x = x;
        this.y = y;
        this.baseY = y;
        this.size = size;
        this.phase = Math.random() * Math.PI * 2;
        this.swayAmp = rand(0.03, 0.18) * (size/40);
        this.bobAmp = rand(2, 8) * (size/40);
        this.rotation = rand(-0.15,0.15);
        this.stroke = '#FFFFFF';
      }
      draw(ctx, t){
        const sway = Math.sin(t + this.phase) * this.swayAmp;
        const bob = Math.sin(t*1.7 + this.phase) * this.bobAmp;
        ctx.save();
        ctx.translate(this.x + sway * 60, this.baseY + bob);
        ctx.rotate(this.rotation + sway*0.6);
        // sombra suave
        ctx.shadowColor = 'rgba(0,0,0,0.25)';
        ctx.shadowBlur = 8;
        // dibujar según tipo
        const s = this.size;
        if(this.type === 'lily'){
          // lirio amarillo: pétalos grandes curvados
          const grad = ctx.createLinearGradient(-s/2,-s,s/2,s);
          grad.addColorStop(0,'#FFE082');
          grad.addColorStop(1,'#FFC107');
          ctx.fillStyle = grad;
          ctx.strokeStyle = this.stroke;
          ctx.lineWidth = Math.max(1, s/16);
          for(let i=0;i<5;i++){
            ctx.save();
            ctx.rotate((i/5)*Math.PI*2 + i*0.06);
            ctx.beginPath();
            ctx.moveTo(0,0);
            ctx.bezierCurveTo(s*0.6, -s*0.2, s*1.0, -s*0.9, 0, -s);
            ctx.bezierCurveTo(-s*1.0, -s*0.9, -s*0.6, -s*0.2, 0,0);
            ctx.closePath();
            ctx.fill(); ctx.stroke();
            ctx.restore();
          }
          ctx.beginPath(); ctx.fillStyle = '#FF8F00'; ctx.arc(0,0,s*0.18,0,Math.PI*2); ctx.fill();
        } else if(this.type === 'sunflower'){
          // girasol: muchos pétalos amarillos y centro marrón
          ctx.strokeStyle = this.stroke;
          ctx.lineWidth = Math.max(1, s/28);
          const petals = 18;
          for(let i=0;i<petals;i++){
            ctx.save();
            ctx.rotate((i/petals)*Math.PI*2);
            ctx.beginPath();
            ctx.ellipse(0, -s*0.7, s*0.18, s*0.5, 0, 0, Math.PI*2);
            ctx.fillStyle = '#FFD54A'; ctx.fill(); ctx.stroke();
            ctx.restore();
          }
          // centro
          const grad = ctx.createRadialGradient(0,0,s*0.1,0,0,s*0.5);
          grad.addColorStop(0,'#6D3B00');
          grad.addColorStop(1,'#3E2200');
          ctx.beginPath(); ctx.fillStyle = grad; ctx.arc(0,0,s*0.45,0,Math.PI*2); ctx.fill();
        } else if(this.type === 'rose'){
          // rosa estilizada: capas de pétalos
          ctx.fillStyle = '#FFC107';
          ctx.strokeStyle = this.stroke;
          ctx.lineWidth = Math.max(1, s/26);
          // dibujar varias capas de arcos
          for(let i=0;i<6;i++){
            ctx.beginPath();
            const r = s*0.9 - i*(s*0.12);
            ctx.ellipse(0, -i*(s*0.04), r, r*0.7, i*0.12, 0, Math.PI*2);
            ctx.fill(); ctx.stroke();
          }
        } else if(this.type === 'daisy'){
          ctx.fillStyle = '#FFE082';
          ctx.strokeStyle = this.stroke;
          ctx.lineWidth = Math.max(1, s/20);
          const petals = 10;
          for(let i=0;i<petals;i++){
            ctx.save(); ctx.rotate((i/petals)*Math.PI*2);
            ctx.beginPath(); ctx.ellipse(0, -s*0.6, s*0.18, s*0.42, 0, 0, Math.PI*2);
            ctx.fill(); ctx.stroke(); ctx.restore();
          }
          ctx.beginPath(); ctx.fillStyle = '#FF8F00'; ctx.arc(0,0,s*0.26,0,Math.PI*2); ctx.fill();
        } else { // poppy/simple
          ctx.fillStyle = '#FFCC4D';
          ctx.strokeStyle = this.stroke;
          ctx.lineWidth = Math.max(1, s/22);
          ctx.beginPath(); ctx.moveTo(0, -s*0.9);
          for(let i=0;i<6;i++){ ctx.quadraticCurveTo(s*0.6, -s*0.2, 0, s*0.6); ctx.rotate(Math.PI/3); }
          ctx.closePath(); try{ ctx.fill(); ctx.stroke(); }catch(e){}
          ctx.beginPath(); ctx.fillStyle = '#FF8F00'; ctx.arc(0,0,s*0.2,0,Math.PI*2); ctx.fill();
        }
        // tallos pequeños (sutileza)
        ctx.restore();
      }
    }

    // Dibuja una maceta decorativa (reemplaza el cono)
    function drawCone(ctx, cx, cy, width, height){
      // Mantener la misma API: cx,cy es la parte superior del envoltorio donde se colocan los textos
      ctx.save();
      // parámetros de la maceta
      const potW = width;
      const potH = Math.max(140, height * 0.9);
      const rimH = Math.min(28, potH * 0.12);
      const bodyH = potH - rimH;

      // dibujar cuerpo de la maceta como un trapecio con lados curvos
      ctx.beginPath();
      const leftTopX = cx - potW/2;
      const rightTopX = cx + potW/2;
      const leftBottomX = cx - potW*0.38;
      const rightBottomX = cx + potW*0.38;
      const topY = cy + rimH;
      const bottomY = cy + potH;
      ctx.moveTo(leftTopX, topY);
      ctx.quadraticCurveTo(cx - potW*0.45, cy + potH*0.35, leftBottomX, bottomY);
      ctx.lineTo(rightBottomX, bottomY);
      ctx.quadraticCurveTo(cx + potW*0.45, cy + potH*0.35, rightTopX, topY);
      ctx.closePath();
      // gradiente del cuerpo
      const gradBody = ctx.createLinearGradient(0, topY, 0, bottomY);
      gradBody.addColorStop(0, '#C48A4B');
      gradBody.addColorStop(1, '#8A5A2B');
      ctx.fillStyle = gradBody;
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.25)';
      ctx.lineWidth = 2;
      ctx.stroke();

      // dibujo del borde (rim) con encaje: una banda superior con semicírculos (scallops)
      ctx.save();
      ctx.beginPath();
      ctx.rect(leftTopX, cy, potW, rimH);
      ctx.clip();
      // banda base
      ctx.fillStyle = '#F5E6D0';
      ctx.fillRect(leftTopX, cy, potW, rimH);
      // encaje inferior: semicírculos repetidos
      const scallopR = Math.max(6, Math.min(12, potW / 30));
      const step = scallopR * 2.2;
      for(let x = leftTopX - scallopR; x <= rightTopX + scallopR; x += step){
        ctx.beginPath();
        ctx.arc(x + scallopR, cy + rimH, scallopR, Math.PI, 2*Math.PI);
        ctx.fillStyle = '#FFF';
        ctx.globalAlpha = 0.9;
        ctx.fill();
        ctx.globalAlpha = 1;
        ctx.strokeStyle = 'rgba(0,0,0,0.06)';
        ctx.lineWidth = 1;
        ctx.stroke();
      }
      // pequeño entramado tipo encaje dentro de la banda
      ctx.globalAlpha = 0.9;
      ctx.fillStyle = '#EAE5DF';
      for(let i=0;i<Math.floor(potW/10);i++){
        const px = leftTopX + i * 10 + 4;
        ctx.beginPath();
        ctx.moveTo(px, cy + 4);
        ctx.lineTo(px + 6, cy + rimH - 6);
        ctx.lineTo(px + 10, cy + 4);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
      ctx.restore();

      // decoración del cuerpo: líneas horizontales sutiles
      ctx.save();
      ctx.strokeStyle = 'rgba(255,255,255,0.04)';
      ctx.lineWidth = 1;
      for(let y = topY + 10; y < bottomY - 10; y += 16){
        ctx.beginPath(); ctx.moveTo(leftTopX + 6, y); ctx.lineTo(rightTopX - 6, y); ctx.stroke();
      }
      ctx.restore();

      // texto dentro de la maceta: lista vertical con 4 líneas
      ctx.save();
      const txtW = potW * 0.76;
      const lines = [
        {text: 'Para la mujer mas hermosa', style: 'bold'},
        {text: 'Mi Esposhita', style: 'italic'},
        {text: '', style: 'italic'} // placeholder para el contador; se gestiona vía DOM
      ];
      let fontBase = Math.round(potW * 0.045);
      ctx.fillStyle = '#3e2a12';
      ctx.shadowColor = 'rgba(0,0,0,0.28)';
      ctx.shadowBlur = 6;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      // centro vertical del cuerpo de la maceta
      const centerY = cy + rimH + (bodyH / 2);
      // calcular espacio entre líneas
      const spacing = Math.max(8, Math.round(fontBase * 0.9));
      // comenzar a dibujar desde arriba de centro, desplazando por (n-1)/2 * spacing
      const startY = centerY - ((lines.length - 1) / 2) * spacing;
      for(let i=0;i<lines.length;i++){
        const ln = lines[i];
        let fsz = Math.round(fontBase * (ln.style === 'bold' ? 1.0 : 0.95));
        if(ln.style === 'bold') ctx.font = `bold ${fsz}px serif`; else ctx.font = `italic ${fsz}px serif`;
        // ajustar si excede
        while(ctx.measureText(ln.text).width > txtW && fsz > 8){ fsz -= 1; if(ln.style === 'bold') ctx.font = `bold ${fsz}px serif`; else ctx.font = `italic ${fsz}px serif`; }
        ctx.fillText(ln.text, cx, startY + i * spacing);
      }
      ctx.restore();

      ctx.restore();
    }

    // Dibuja un tallo curvado desde el cono hasta la flor
    function drawStem(ctx, cx, cyBottom, fx, fy){
      ctx.save();
      ctx.strokeStyle = 'rgba(60,110,50,0.95)';
      ctx.lineWidth = Math.max(1, Math.min(4, (cyBottom - fy)/60));
      ctx.beginPath();
      const midX = (cx + fx)/2 + (fx - cx) * 0.12;
      const midY = (cyBottom + fy)/2 - Math.abs(fx - cx) * 0.08;
      ctx.moveTo(cx, cyBottom);
      ctx.quadraticCurveTo(midX, midY, fx, fy + 8);
      ctx.stroke();
      ctx.restore();
    }




    // Crear ramo
    const bouquet = [];
    function createBouquet(){
      bouquet.length = 0;
      const cx = window.innerWidth/2;
      const cy = window.innerHeight/2 - Math.max(40, coneW*0.12);
      // calcular posiciones relativas al cono/texto para asegurar que las flores queden por encima del texto
      const coneTopY = cy + 40;
      const coneHeight = Math.max(180, coneW*0.9);
      const textY1 = coneTopY + coneHeight * 0.26; // posición del primer renglón en el cono
      const textMargin = Math.max(14, coneW * 0.04);
      // ajustar cantidad de flores: doblar en móvil según petición
      let count;
      if(window.innerWidth < 420){
        // móvil: duplicar el número base
        count = (performanceMode ? 5 : 7) * 2;
      } else {
        count = (performanceMode ? 7 : 11);
      }
      for(let i=0;i<count;i++){
        const spread = (window.innerWidth < 420) ? 0.6 : 0.45; // más separación en móvil
        const angle = (i - (count-1)/2) * spread + rand(-0.08,0.08);
        const minR = Math.max(coneW*0.12, 20);
        const maxR = Math.max(coneW*1.05, coneW + 30);
        const radius = rand(minR, maxR) + Math.abs(i-(count-1)/2)*6;
        const x = cx + Math.sin(angle) * radius + rand(-18,18);
        let y = cy + Math.cos(angle) * (radius*0.42) + rand(-18,18) - Math.abs(i-(count-1)/2)*6;
        // asegurar que la flor quede por encima (arriba) del primer renglón del texto en el cono
        const minY = textY1 - textMargin - Math.max(16, coneW*0.06);
        if(y > minY) y = minY - rand(6, 28);
        const types = ['lily','daisy','poppy','rose','sunflower'];
        const t = types[Math.floor(rand(0, types.length))];
        // reducir tamaño de las flores para no tapar texto del cono
        const size = rand(Math.max(12, coneW*0.10), Math.max(30, coneW*0.28)) * (1 - Math.abs((i - (count-1)/2)/(count*1.4)));
        bouquet.push(new Flower(t, x, y, size));
      }
      // separar más: ordenar por y para dibujar profundidad y evitar solapado
      bouquet.sort((a,b)=> a.y - b.y);
    }
    // inicializar (redimensiona y luego crea partículas, ramo y pool de destellos)
    resize();
    createParticles();
    createBouquet();
    createFlashPool();
    // spawn rate de flashes (por segundo)
    // aumentar para flashes más rápidos: multiplica el valor base
    let flashRate = (performanceMode ? 0.6 : 1.2) * 2.5; // ~2.5x más rápidos por defecto


    // Animación
    let last = performance.now();
    let lastRender = performance.now();
    // limitar FPS para mejorar rendimiento
    let targetFPS = (window.innerWidth < 420) ? 30 : 45;
    window.addEventListener('resize', ()=>{
      targetFPS = (window.innerWidth < 420) ? 30 : 45;
      // recalcular canvas, partículas y ramo al cambiar el tamaño
      resize();
      createParticles();
      createBouquet();
    });
    // pausar cuando la pestaña no está visible
    let running = true;
    document.addEventListener('visibilitychange', ()=>{
      running = !document.hidden;
      if(running){ last = performance.now(); lastRender = performance.now(); requestAnimationFrame(loop); }
    });
    function loop(now){
      if(!running) return;
      // controlar tasa de frames
      const elapsedRender = now - lastRender;
      const minFrameTime = 1000 / targetFPS;
      if(elapsedRender < minFrameTime){ requestAnimationFrame(loop); return; }
      lastRender = now;

      const dtms = now - last; last = now;
      const dt = Math.min(40, dtms) / (1000/60); // normalizar a frames de 60fps
      const t = now / 600; // tiempo para animaciones (usar now ya proporcionado)
      // limpiar (usar coordenadas CSS para compatibilidad Safari)
      ctx.clearRect(0,0,window.innerWidth,window.innerHeight);
      // fondo negro completo
      ctx.fillStyle = '#000';
      ctx.fillRect(0,0,window.innerWidth, window.innerHeight);

      // actualizar y dibujar flashes (fondo)
      const dtSeconds = dtms / 1000;
      const spawnProb = flashRate * dtSeconds;
      if(Math.random() < spawnProb) spawnFlash();
      for(const f of flashPool){ f.update(dt); f.draw(ctx); }

      // dibujar partículas
      for(const p of particles){
        p.update(dt);
        p.draw(ctx);
      }

      // (Flores pequeñas eliminadas; no se dibujan aquí)

      // dibujar ramo en el centro (encima de partículas)
      const cx = window.innerWidth/2;
      const cy = window.innerHeight/2 - 20;
      // cono
      // usar coneW global (ya calculado en resize)
      drawCone(ctx, cx, cy + 40, coneW, Math.max(180, coneW * 0.9));
      // texto en arco eliminado por petición
      // tallos (debajo de flores)
      for(const f of bouquet){
        const sway = Math.sin(t + f.phase) * f.swayAmp;
        const bob = Math.sin(t*1.7 + f.phase) * f.bobAmp;
        const fx = f.x + sway * 60;
        const fy = f.baseY + bob;
        drawStem(ctx, cx, cy + 40, fx, fy);
      }
      // flores
      for(const f of bouquet){
        f.draw(ctx, t);
      }

      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);

    // Si la pestaña estaba oculta, la primera animación puede saltar; forzar redraw en foco
    window.addEventListener('focus', ()=> resize());

  // --- Contador de tiempo desde 15 sep 2025 ---
  (function(){
    const from = new Date('2025-09-15T00:00:00');
    const elValues = document.getElementById('timeValues');
    const elCounter = document.getElementById('timeCounter');
    const elPhrase = document.getElementById('timePhrase');
    if(!elValues) return;
    function pad(n){return String(n).padStart(2,'0')}
    function computeElapsed(fromDate, now){
      let y = now.getFullYear() - fromDate.getFullYear();
      let m = now.getMonth() - fromDate.getMonth();
      let d = now.getDate() - fromDate.getDate();
      let hh = now.getHours() - fromDate.getHours();
      let mm = now.getMinutes() - fromDate.getMinutes();
      let ss = now.getSeconds() - fromDate.getSeconds();

      if(ss < 0){ ss += 60; mm -= 1 }
      if(mm < 0){ mm += 60; hh -= 1 }
      if(hh < 0){ hh += 24; d -= 1 }

      if(d < 0){
        const prevMonth = new Date(now.getFullYear(), now.getMonth(), 0); // último día mes previo
        d += prevMonth.getDate();
        m -= 1;
      }
      if(m < 0){ m += 12; y -= 1 }
      return {years: y, months: m, days: d, hours: hh, minutes: mm, seconds: ss};
    }

    function update(){
      const now = new Date();
      // calcular años, meses, días, horas y segundos transcurridos
      const t = computeElapsed(from, now);
      // calcular tamaños y anchura interna de la maceta
      const font2 = Math.max(10, Math.round(coneW * 0.055));
      const txtW = Math.round(coneW * 0.76);

      try{
        // asegurar que el contenedor tenga el ancho máximo permitido
        if(elCounter) elCounter.style.width = txtW + 'px';

        // aplicar formato a la frase y forzar que sea bloque centrado
        if(elPhrase){
          elPhrase.style.display = 'block';
          elPhrase.style.fontStyle = 'italic';
          elPhrase.style.fontFamily = 'serif';
          elPhrase.style.color = '#3e2a12';
          elPhrase.style.width = txtW + 'px';
          elPhrase.style.margin = '0';
          elPhrase.style.lineHeight = '1.1';
          elPhrase.style.overflow = 'hidden';
          elPhrase.style.whiteSpace = 'normal';
          elPhrase.style.textAlign = 'center';
          // ajustar tamaño hasta que quepa
          let ffs = font2;
          elPhrase.style.fontSize = ffs + 'px';
          while(elPhrase.scrollWidth > txtW && ffs > 8){ ffs -= 1; elPhrase.style.fontSize = ffs + 'px'; }
        }

        // aplicar formato al contador y colocarlo como bloque debajo de la frase
        elValues.style.display = 'block';
        elValues.style.fontStyle = 'italic';
        elValues.style.fontFamily = 'serif';
        elValues.style.color = '#3e2a12';
        elValues.style.width = txtW + 'px';
        elValues.style.textAlign = 'center';
        elValues.style.overflow = 'hidden';
        elValues.style.whiteSpace = 'normal';
        // fijar texto consolidado en un único contenedor
        elValues.textContent = `${t.years} años · ${t.months} meses · ${t.days} días · ${t.hours} horas · ${t.seconds} segundos`;
        // ajustar tamaño de fuente si el texto no cabe
        let fs = font2;
        elValues.style.fontSize = fs + 'px';
        while(elValues.scrollWidth > txtW && fs > 8){ fs -= 1; elValues.style.fontSize = fs + 'px'; }
      }catch(e){
        // fallback básico
        elValues.textContent = `${t.years} años · ${t.months} meses · ${t.days} días · ${t.hours} horas · ${t.seconds} segundos`;
      }

      // posicionar el contenedor justo debajo de la tercera línea dibujada en la maceta
      try{
        const baseCy = window.innerHeight/2 - 20;
        const drawCy = baseCy + 40; // mismo valor usado al llamar drawCone
        const potW = coneW;
        const potH = Math.max(180, coneW * 0.9);
        const rimH = Math.min(28, potH * 0.12);
        const bodyH = potH - rimH;
        const fontBase = Math.round(potW * 0.045);
        const spacing = Math.max(8, Math.round(fontBase * 0.9));
        const centerY = drawCy + rimH + (bodyH / 2);
        const startY = centerY - ((4 - 1) / 2) * spacing; // 4 líneas dibujadas
        const thirdLineY = startY + 2 * spacing; // índice 2 (0-based)
        const top = Math.round(thirdLineY + Math.max(8, spacing / 2));
        if(elCounter) elCounter.style.top = `${top}px`;
        // asegurar separación manejada por gap en el contenedor flex
        if(elPhrase) elPhrase.style.marginBottom = '0';
      }catch(e){/* silently ignore */}
    }

    update();
    setInterval(update, 1000);
    // exponer ajuste manual si se desea
    window.setTimeCounterOffset = function(px){ if(elCounter) elCounter.style.top = `calc(50% + ${px}px)` }
  })();
  </script>
